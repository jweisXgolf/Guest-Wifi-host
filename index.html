<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>X-Golf Glen Carbon — Guest WiFi</title>
<style>
  body { font-family: -apple-system, Segoe UI, Arial, sans-serif; background:#0b1f14; color:#fff;
         display:flex; align-items:center; justify-content:center; min-height:100vh; margin:0; }
  .card { background:#123b25; padding:32px 28px; border-radius:14px; max-width:380px; text-align:center;
          box-shadow:0 8px 24px rgba(0,0,0,.3); }
  h1 { font-size:1.3rem; margin-bottom:8px; }
  p { font-size:.95rem; line-height:1.4; color:#d8e6dc; }
  a.btn { display:inline-block; margin-top:20px; background:#3ddc84; color:#06210f; font-weight:700;
          padding:12px 22px; border-radius:8px; text-decoration:none; }
  .spinner { margin:18px auto; width:28px; height:28px; border:3px solid #2c5c3f; border-top-color:#3ddc84;
             border-radius:50%; animation:spin 1s linear infinite; }
  @keyframes spin { to { transform:rotate(360deg); } }
</style>
</head>
<body>
  <div class="card" id="card">
    <h1 id="title">Connecting to X-Golf WiFi…</h1>
    <p id="msg">One moment while we get you online.</p>
    <div class="spinner" id="spinner"></div>
    <a class="btn" id="actionBtn" href="#" style="display:none;"></a>
  </div>

<script>
/*
  X-Golf Glen Carbon — Guest WiFi redirect-catcher.

  Apple's WiFi sign-in popup ("Captive Network Assistant") is a heavily restricted
  mini-browser that fails to run Zapier's form-submission JS reliably (confirmed:
  same form works fine in real Safari). To work around this, we avoid automatic
  script-driven redirects and instead show the guest a real tappable button at each
  step — a genuine link tap is far more likely to hand off to full Safari than a
  JS `location.replace()` call, which tends to stay stuck inside the restricted view.

  Zapier Interfaces form fields also cannot dynamically pre-fill from an incoming URL
  parameter, and its "Navigate to external URL" action cannot use a dynamic/field
  value as the redirect target (both confirmed to only support static text) — so we
  can't rely on Zapier to carry Meraki's one-time `base_grant_url` value through the
  form submission and back to us. Instead, THIS page remembers it directly:

  1) INBOUND (from Meraki): Meraki loads this page as the SSID's Custom Splash URL
     and appends `base_grant_url` (the one-time link that grants network access) as a
     query parameter. We save that value in this browser's storage, then show a
     "Continue to Sign-Up" button pointing at the Zapier sign-up form.

  2) RETURN (from Zapier): After the guest submits the form, Zapier's "Navigate to
     external URL" action sends them back to this same page (no base_grant_url query
     param present this time — that's how we detect we're on the return trip). We
     read back the value we stored in step 1 and show a "Connect to WiFi" button
     pointing straight at it — tapping it completes the handshake with Meraki and
     unlocks internet access.

  Config: update ZAPIER_FORM_URL below to match your published Zapier Interfaces page.
*/
var ZAPIER_FORM_URL = "https://new-form-project-1b1309.zapier.app/x-golf-guest-wifi-sign-up";
var STORAGE_KEY = "xgolf_base_grant_url";

function getParams() {
  return new URLSearchParams(window.location.search);
}

function saveGrantUrl(url) {
  try { sessionStorage.setItem(STORAGE_KEY, url); } catch (e) {}
  try { localStorage.setItem(STORAGE_KEY, url); } catch (e) {}
}

function loadGrantUrl() {
  try {
    return sessionStorage.getItem(STORAGE_KEY) || localStorage.getItem(STORAGE_KEY);
  } catch (e) {
    return null;
  }
}

function showButton(label, href, openInNewTab) {
  document.getElementById("spinner").style.display = "none";
  var btn = document.getElementById("actionBtn");
  btn.textContent = label;
  btn.href = href;
  if (openInNewTab) { btn.target = "_blank"; btn.rel = "noopener"; }
  btn.style.display = "inline-block";
}

(function () {
  var params = getParams();
  var inboundGrantUrl = params.get("base_grant_url");
  var title = document.getElementById("title");
  var msg = document.getElementById("msg");

  if (inboundGrantUrl) {
    // First hop from Meraki: remember the grant link, then prompt guest to continue.
    saveGrantUrl(inboundGrantUrl);
    title.textContent = "Welcome to X-Golf Glen Carbon";
    msg.textContent = "Tap below to sign up for guest WiFi with your email.";
    showButton("Continue to Sign-Up →", ZAPIER_FORM_URL, true);
    return;
  }

  var storedGrantUrl = loadGrantUrl();
  if (storedGrantUrl) {
    // Return trip from Zapier: prompt guest to finish connecting.
    title.textContent = "You're almost connected!";
    msg.textContent = "Tap below to finish connecting to WiFi.";
    showButton("Connect to WiFi →", storedGrantUrl, false);
    return;
  }

  title.textContent = "X-Golf Glen Carbon Guest WiFi";
  msg.textContent = "This page is meant to be opened from the WiFi sign-in screen.";
  document.getElementById("spinner").style.display = "none";
})();
</script>
</body>
</html>
